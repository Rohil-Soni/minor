[package]
name = "image-reader"
version = "0.1.0"
edition = "2024"

[dependencies]
# I/O and Discovery
walkdir = "2.5"

# Concurrency Pipeline
crossbeam-channel = "0.5"
rayon = "1.10"

# High-Speed Decoding
zune-jpeg = "0.4"

#for cnn loop for microsoft onnx runtime
#optional: prebuilt binaries are MSVC-only, enable with `--features onnx`
ort = { version = "2.0.0-rc.13", optional = true }

#exif
kamadak-exif = "0.6.1"

#serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

#rfc3339 timestamp for the json envelope
humantime = "2.1"

#image
image = "0.24.7"
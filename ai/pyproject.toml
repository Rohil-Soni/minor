[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "photoholic-ai"
version = "0.1.0"
description = "Photoholic aesthetic scoring, grouping and selection"
requires-python = ">=3.10"
authors = [
    { name = "Raghav Maheshwari" },
    { name = "Ajinkya Borwankar" },
    { name = "Rohil Soni" },
]

[tool.setuptools.packages.find]
include = ["photoholic_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
